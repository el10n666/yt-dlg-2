<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Скачать видео</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="window">
    <header class="titlebar">
      <div class="drag"></div>
      <div class="lights">
        <button id="close" class="light close" aria-label="Закрыть"></button>
        <button id="min" class="light min" aria-label="Свернуть"></button>
        <button id="full" class="light full-btn" aria-label="Во весь экран"></button>
      </div>
      <span class="title">Скачать видео</span>
    </header>

    <div class="scroll">
    <section class="compose">
      <h1>Что скачать?</h1>
      <div class="field">
        <input id="url" type="text" placeholder="Вставьте ссылку на видео" autocomplete="off" spellcheck="false">
        <button id="paste" class="paste">Вставить</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Формат">
        <input type="radio" name="mode" id="m-video" value="video" checked>
        <label for="m-video">Видео</label>
        <input type="radio" name="mode" id="m-audio" value="audio">
        <label for="m-audio">Только звук</label>
      </div>
      <p id="hint" class="hint" role="alert"></p>
      <button id="go" class="go">Скачать</button>

      <details id="adv" class="adv">
        <summary>Дополнительно</summary>
        <div class="adv-body">
          <label class="row" for="opt-playlist">
            <span class="row-text"><span class="row-title">Скачивать весь плейлист</span><span class="row-sub">Если выключено, берётся одно видео</span></span>
            <span class="switch"><input type="checkbox" id="opt-playlist" role="switch"><span class="knob"></span></span>
          </label>
          <label class="row" for="opt-zapret">
            <span class="row-text"><span class="row-title">Обход блокировок</span><span id="zapret-sub" class="row-sub">Для YouTube и Discord. Windows спросит разрешение</span></span>
            <span class="switch"><input type="checkbox" id="opt-zapret" role="switch"><span class="knob"></span></span>
          </label>
          <div class="field-row">
            <label for="opt-browser">Войти через браузер</label>
            <select id="opt-browser">
              <option value="">Не нужно</option>
              <option value="chrome">Chrome</option>
              <option value="edge">Edge</option>
              <option value="firefox">Firefox</option>
              <option value="opera">Opera</option>
              <option value="brave">Brave</option>
              <option value="vivaldi">Vivaldi</option>
            </select>
          </div>
          <div class="field-row">
            <label for="opt-proxy">Прокси</label>
            <input id="opt-proxy" type="text" placeholder="адрес:порт" autocomplete="off" spellcheck="false">
          </div>
          <div class="field-row">
            <label for="opt-folder">Куда сохранять</label>
            <button id="opt-folder" class="pick" type="button">Папка «Загрузки»</button>
          </div>
          <p id="adv-hint" class="hint" role="alert"></p>
        </div>
      </details>
    </section>

    <section class="downloads">
      <h2>Загрузки</h2>
      <ul id="list"></ul>
      <p id="empty" class="empty">Здесь появятся ваши загрузки. Скопируйте ссылку и нажмите «Вставить».</p>
    </section>
    </div>

    <footer class="footer">
      <button id="folder" class="link">Открыть папку «Загрузки»</button>
      <button id="report" class="link">Сообщить о проблеме</button>
    </footer>
  </main>
  <script src="platform.js"></script>
  <script src="app.js"></script>
</body>
</html>
